name: github-policy

on:
  push:
    branches: [main]
    paths: ["infra/github/**"]
  pull_request:
    paths: ["infra/github/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: auto
  PULUMI_BACKEND_URL: s3://ktbhealth-pulumi-state?endpoint=2c03574ae47e534415b762ab3c474815.r2.cloudflarestorage.com&s3ForcePathStyle=true&region=auto
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  # GITHUB_TOKEN (workflow default) likely lacks admin:org /
  # admin:org_hook — prefer an org-admin PAT stored as ORG_ADMIN_TOKEN.
  GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: pulumi/actions@v6
        with:
          only-install: true
      - run: pulumi preview

  up:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: pulumi/actions@v6
        with:
          only-install: true
      - run: pulumi up --yes --skip-preview --stack prod
      # Baseline policy for repos not yet codified in src/repos.ts.
      # Exits 1 while unmanaged repos exist — expected until the list
      # covers the whole org; reconcile still patches them first.
      - run: bun run reconcile
