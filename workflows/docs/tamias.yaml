# docs — pull_request closed+merged → sepia agent syncs hand-written
# docs → PR on ktbhealth/docs. Tamias bundle
# (`type: peregrin-bundle`).
#
# Companion to erd-docs: generated ERD/schema content is owned there;
# this bundle owns the hand-written MDX under content/docs/{en,pt-BR}/.
name: docs
version: 0.1.0
type: peregrin-bundle
description: >-
  PR merged to product main → sepia agent reviews product@origin/main
  and updates the hand-written docs (en + pt-BR parity) in a lasius
  worktree of ktbhealth/docs → campaign commits, pushes
  docs/sync-<sha>, opens a PR. Cumulative sync (one run covers every
  merge since the last); generated content explicitly excluded.

provider:
  # SHARED provider identity — same as every peregrin-bundle: all
  # bundles render services into the ONE peregrin-campaign.service
  # hosting ~/.config/peregrin/serve/*.yaml on the shared webhook
  # listener. Keep `exec` identical.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Advisory only — the GitHub webhook is registered per repo
    # against the shared listener's LIVE public URL. No hooks[] —
    # registration is an operator step (see README).
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
