# deploy — push to a watched repo's deploy ref → worktree deploy →
# cooldown throttle. Tamias bundle (`type: peregrin-bundle`);
# ktbhealth continuous deployment for the alchemy/Cloudflare
# services, generalized from 9aia's docs-deploy shape.
#
# Boundaries: lasius owns every git/forge call (fetch, worktree
# add/remove, commit statuses), the deploy command is each repo's
# own script, peregrin owns only event routing, tamias distributes.
name: deploy
version: 0.1.0
type: peregrin-bundle
description: >-
  Push to refs/heads/<deploy_ref> → pending commit status → lasius
  worktree at the pushed sha → bun install + deploy_cmd (each
  service's own build/deploy) → verdict commit status →
  cooldown_secs throttle window. At most one deploy per service per
  window; pending pushes coalesce to the newest sha
  (supersede latest-wins, cancel_running: false).

provider:
  # SHARED provider identity — same as every peregrin-bundle: all
  # bundles render services into the ONE peregrin-campaign.service
  # hosting ~/.config/peregrin/serve/*.yaml on the shared webhook
  # listener. Keep `exec` identical.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Advisory only — the GitHub webhook is registered per repo
    # against the shared listener's LIVE public URL, with `push`
    # added to its event set. No hooks[] — registration is an
    # operator step (see README).
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
